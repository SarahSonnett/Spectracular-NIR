[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spectracular-nir"
version = "0.1.0"
description = "Spectracular-NIR: asteroid reflectance pipeline for NASA IRTF SpeX, built on pyspextool (Cushing et al. 2004 protocols)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Stephanie Sonnett" }]
dependencies = [
    "pyspextool",
    "numpy",
    "scipy",
    "matplotlib",
    "astropy",
]

[project.scripts]
spexrock-run = "spexrock.cli.run:main"

[tool.setuptools.packages.find]
include = ["spexrock*"]
